<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบสมาชิกกองทุนสวัสดิการชุมชน</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* CSS Fintech ชุดเดิม... */
    :root { --fintech-primary: #0F172A; --fintech-accent: #2563EB; --fintech-success: #10B981; --bg-light: #F3F4F6; --card-border: #E5E7EB; }
    body { background-color: var(--bg-light); font-family: 'Prompt', sans-serif; color: #1E293B; -webkit-tap-highlight-color: transparent; }
    .app-header { background: var(--fintech-primary); background-image: radial-gradient(circle at top right, #1E293B 0%, transparent 60%); color: white; padding: 40px 20px 100px; text-align: center; }
    .card-box { background: white; padding: 25px 20px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); max-width: 500px; margin: -60px auto 30px; position: relative; border: 1px solid var(--card-border); }
    .profile-wrapper { position: relative; margin-top: -65px; text-align: center; margin-bottom: 15px; }
    .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid white; background: white; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
    .badge-status { padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-bottom: 15px; }
    .status-active { background-color: #D1FAE5; color: #059669; border: 1px solid #A7F3D0; } .status-pending { background-color: #FEF3C7; color: #D97706; border: 1px solid #FDE68A; }
    .badge-tier { padding: 5px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; color: white; display: inline-flex; align-items: center; gap: 6px; margin-top: 5px; }
    .stat-card { border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; transition: transform 0.2s; }
    .stat-card-points { background: linear-gradient(135deg, #FFFBEB 0%, #FEF08A 100%); border: 1px solid #FDE047; }
    .stat-card-contrib { background: linear-gradient(135deg, #ECFDF5 0%, #A7F3D0 100%); border: 1px solid #6EE7B7; }
    .stat-card-welfare { background: linear-gradient(135deg, #EFF6FF 0%, #BFDBFE 100%); border: 1px solid #93C5FD; }
    .icon-box { width: 48px; height: 48px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; }
    .stat-card-points .icon-box { background: #F59E0B; color: white; } .stat-card-contrib .icon-box { background: #10B981; color: white; } .stat-card-welfare .icon-box { background: #3B82F6; color: white; }
    .btn-action-sm { background: white; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .stat-card-points .btn-action-sm { color: #D97706; } .stat-card-contrib .btn-action-sm { color: #059669; } .stat-card-welfare .btn-action-sm { color: #2563EB; }
    .mission-hub { background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
    .mission-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 15px 10px; }
    .info-list { background: white; border-radius: 16px; border: 1px solid var(--card-border); margin-bottom: 20px; overflow: hidden; }
    .info-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #F3F4F6; }
    .info-label { color: #6B7280; font-size: 0.85rem; font-weight: 500; } .info-data { color: #111827; font-size: 0.9rem; font-weight: 600; text-align: right; }
    .form-control, .form-select { border-radius: 12px; border: 1px solid #D1D5DB; padding: 14px; font-size: 0.95rem; }
    .btn-fintech { background: var(--fintech-primary); color: white; border-radius: 14px; padding: 14px; font-weight: 600; width: 100%; border: none; }
    #systemLoading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  </style>
</head>
<body>
<div id="systemLoading">
  <div class="spinner-border mb-3" style="width: 3rem; height: 3rem; color: var(--fintech-primary);" role="status"></div>
  <p class="text-dark fw-bold">กำลังเชื่อมต่อฐานข้อมูลกองทุน...</p>
</div>

<div class="app-header">
  <h4 class="fw-bold mb-1">กองทุนสวัสดิการชุมชน</h4>
  <p class="text-white-50 small mb-0" id="headerFundName">ระบบสมาชิกดิจิทัล</p>
</div>

<div class="container mb-5 px-3">
  
  <!-- 📝 Register View -->
  <div id="registerView" class="card-box" style="display: none;">
    <div class="text-center mb-4">
      <div class="icon-box bg-primary bg-opacity-10 text-primary mx-auto mb-3" style="width: 60px; height: 60px;"><i class="fa-solid fa-user-plus"></i></div>
      <h5 class="fw-bold text-dark mb-1">ลงทะเบียนสมาชิก</h5>
      <p class="text-muted small">กรอกข้อมูลให้ครบถ้วนเพื่อรับสิทธิประโยชน์</p>
    </div>
    
    <form id="directRegisterForm" onsubmit="handleDirectRegister(event)">
      <input type="hidden" name="action" value="register"> 
      <input type="hidden" id="uid" name="uid">
      <div class="row g-2 mb-3">
        <div class="col-4">
          <select class="form-select" name="prefix" required>
            <option value="" disabled selected>คำนำหน้า</option><option value="นาย">นาย</option><option value="นาง">นาง</option><option value="นางสาว">นางสาว</option>
          </select>
        </div>
        <div class="col-8"><input type="text" class="form-control" name="fullName" placeholder="ชื่อ-นามสกุล" required></div>
      </div>
      <div class="mb-3"><input type="tel" class="form-control fw-bold" name="nationalId" placeholder="เลขประจำตัวประชาชน (13 หลัก)" maxlength="13" oninput="this.value=this.value.replace(/[^0-9]/g,'');" required></div>
      <div class="mb-3"><input type="tel" class="form-control" name="phone" placeholder="เบอร์โทรศัพท์ (08XXXXXXXX)" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'');" required></div>
      
      <!-- ระบุชื่อศูนย์ของเทศบาลนี้โดยเฉพาะ -->
      <div class="mb-3">
        <label class="small text-muted fw-bold ms-1 mb-1">เลือกศูนย์ประสานงานใกล้บ้าน</label>
        <select class="form-select fw-bold text-dark" name="center" id="regCenterSelect" required></select>
      </div>
      <div class="mb-4">
        <input type="text" class="form-control" name="village" placeholder="ชื่อหมู่บ้าน/ชุมชนที่พักอาศัย" required>
      </div>
      <button type="submit" class="btn btn-fintech" id="submitRegBtn">สมัครเข้าสู่กองทุน</button>
    </form>
  </div>

  <!-- 📊 Dashboard View -->
  <div id="dashboardView" class="card-box text-center" style="display: none;">
    <div class="profile-wrapper"><img id="userAvatar" src="" class="profile-img"></div>
    <div id="dashStatusBadge" class="badge-status">รอตรวจสอบ</div>
    <h4 id="dashName" class="fw-bold mb-0 text-dark"></h4>
    <p class="text-muted small mb-2"><i class="fa-solid fa-location-dot me-1"></i><span id="dashCenterText"></span></p>
    <div id="dashTierBadge" class="badge-tier" style="display: none;"></div>
    <hr class="my-4" style="border-color: #E5E7EB;">
    
    <div class="d-flex flex-column gap-2 mb-4">
      <div class="stat-card stat-card-contrib text-start m-0 position-relative">
        <div class="d-flex align-items-center gap-3"><div class="icon-box"><i class="fa-solid fa-piggy-bank"></i></div><div><small class="fw-bold d-block lh-1 mb-1" style="color: #065F46;">ยอดสมทบสะสม</small><h4 class="fw-bold mb-0 text-dark"><span id="dashTotalContrib">0</span> <small class="fs-6 fw-normal">฿</small></h4></div></div>
        <a href="contribution.html" class="btn-action-sm text-decoration-none"><i class="fa-solid fa-plus"></i> สมทบ</a>
      </div>
      <div class="stat-card stat-card-welfare text-start m-0">
        <div class="d-flex align-items-center gap-3"><div class="icon-box"><i class="fa-solid fa-hand-holding-heart"></i></div><div><small class="fw-bold d-block lh-1 mb-1" style="color: #1E3A8A;">รับสวัสดิการรวม</small><h4 class="fw-bold mb-0 text-dark"><span id="dashTotalWelfare">0</span> <small class="fs-6 fw-normal">฿</small></h4></div></div>
        <a href="claim.html" class="btn-action-sm text-decoration-none"><i class="fa-solid fa-file-medical"></i> ขอเบิก</a>
      </div>
    </div>
    
    <div class="text-start mt-4">
      <div class="section-title m-0 mb-3"><i class="fa-solid fa-id-card text-muted me-2"></i> ข้อมูลส่วนตัว</div>
      <div class="info-list">
        <div class="info-row"><span class="info-label">รหัสสมาชิก</span><span class="info-data text-primary fs-6" id="dashMemberId"></span></div>
        <div class="info-row"><span class="info-label">เลข ปชช.</span><span class="info-data" id="dashNatId"></span></div>
        <div class="info-row"><span class="info-label">วันที่สมัคร</span><span class="info-data" id="dashDate"></span></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================================
  // ⚙️ ตั้งค่าระบบ (CONFIG) - แก้ไขแค่ส่วนนี้เวลาทำกองทุนใหม่!
  // ==========================================================
  const CWF_CONFIG = {
      FUND_NAME: "เทศบาลตำบลสุคิริน", 
      LIFF_ID: "2010977535-YsYO2i2t", 
      API_URL: "https://script.google.com/macros/s/AKfycbxGdhFdZpP3lkAdNkf8UrRs5o4OI-Mi85jmtMEvotSc6ot_gBvPEbE3mPDX_de78RL6sw/exec",
      CENTERS: ["ศูนย์ชุมชนปารีย์", "ศูนย์ชุมชนเกียร์", "ศูนย์ชุมชนราษฎร์สามัคคี", "ศูนย์ชุมชนกลันตัน", "ศูนย์ชุมชนมาโมง", "ศูนย์ชุมชนสุคิริน"]
  };
  // ==========================================================

  document.getElementById('headerFundName').innerText = CWF_CONFIG.FUND_NAME;

  document.addEventListener("DOMContentLoaded", async () => {
    // โหลดรายชื่อศูนย์ใส่ฟอร์ม
    const centerSelect = document.getElementById('regCenterSelect');
    centerSelect.innerHTML = '<option value="" disabled selected>-- เลือกศูนย์ประสานงาน --</option>';
    CWF_CONFIG.CENTERS.forEach(c => {
        const opt = document.createElement('option'); opt.value = c; opt.text = c; centerSelect.appendChild(opt);
    });

    try {
      await liff.init({ liffId: CWF_CONFIG.LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        document.getElementById('uid').value = profile.userId;
        await checkDirectStatus(profile.userId, profile.pictureUrl || "https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/icons/person-circle.svg");
      } else { liff.login(); }
    } catch (err) { 
      document.getElementById('systemLoading').innerHTML = `<div class="text-danger text-center px-4"><h6>System Error</h6><p>${err.message}</p></div>`; 
    }
  });

  async function checkDirectStatus(uid, pictureUrl) {
    // ⚡ ดึงข้อมูลตรงจาก API ท้องถิ่นทันที (ไม่ต้องผ่าน Hub)
    try {
      const response = await fetch(CWF_CONFIG.API_URL, { method: "POST", body: JSON.stringify({ action: "checkStatus", uid: uid }) });
      const result = await response.json();
      document.getElementById('systemLoading').style.display = 'none';
      
      if (result.status === 'registered') {
        renderDashboardData(result.memberData, pictureUrl); 
      } else { 
        document.getElementById('registerView').style.display = 'block'; 
      }
    } catch (e) { 
       document.getElementById('systemLoading').style.display = 'none'; 
       Swal.fire('Error', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
    }
  }

  async function handleDirectRegister(e) {
    e.preventDefault(); 
    const btn = document.getElementById('submitRegBtn'); btn.disabled = true; btn.innerHTML = 'กำลังประมวลผล...';
    const payload = Object.fromEntries(new FormData(e.target).entries()); 
    payload.nationalId = payload.nationalId.replace(/\D/g, ''); payload.phone = payload.phone.replace(/\D/g, '');
    
    if (payload.nationalId.length !== 13) { Swal.fire('แจ้งเตือน', 'เลข ปชช. 13 หลัก', 'warning'); btn.disabled=false; return; }
    
    try {
      const res = await fetch(CWF_CONFIG.API_URL, { method: "POST", body: JSON.stringify(payload) }).then(r=>r.json());
      if (res.status === 'success') {
        Swal.fire({ title: 'สำเร็จ!', text: 'เข้าสู่สมุดบัญชี', icon: 'success' }).then(() => location.reload()); 
      } else { Swal.fire('ข้อผิดพลาด', res.message, 'error'); btn.disabled = false; }
    } catch (e) { Swal.fire('Error', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error'); btn.disabled = false; }
  }

  function renderDashboardData(data, pictureUrl) {
    document.getElementById('userAvatar').src = pictureUrl;
    document.getElementById('dashName').innerText = (data.prefix || "") + " " + data.fullName;
    document.getElementById('dashCenterText').innerText = " " + (data.center || "สมาชิกกองทุน");
    
    const badge = document.getElementById('dashStatusBadge');
    badge.innerText = data.status;
    badge.className = data.status === 'เป็นสมาชิก' ? "badge-status status-active" : "badge-status status-pending";
    
    document.getElementById('dashTotalContrib').innerText = (data.totalContribution || 0).toLocaleString();
    document.getElementById('dashTotalWelfare').innerText = (data.totalWelfareReceived || 0).toLocaleString();
    document.getElementById('dashMemberId').innerText = data.memberId || "-";
    
    let nId = String(data.nationalId || "").replace(/\D/g, ''); document.getElementById('dashNatId').innerText = nId.length === 13 ? `${nId.substring(0,5)}XXXX${nId.substring(9,13)}` : "-";
    document.getElementById('dashDate').innerText = data.timestamp || "-";
    
    document.getElementById('dashboardView').style.display = 'block';
  }
</script>
</body>
</html>
